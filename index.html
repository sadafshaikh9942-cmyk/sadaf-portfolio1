<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadafmade.it — Cinematic Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--yellow:#FFB703;
--yellow-soft:#FFE082;
--dark:#121212;
--blue:#4361EE;
--white:#ffffff;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:'Poppins', sans-serif;
background:linear-gradient(180deg,var(--yellow),var(--yellow-soft));
color:var(--dark);
overflow-x:hidden;
cursor:none;
text-align:center;
}

/* remove default cursor */
button,.reel,.service,a{
cursor:none;
}

/* CURSOR */
.cursor{
width:14px;
height:14px;
border-radius:50%;
background:var(--blue);
position:fixed;
pointer-events:none;
z-index:2000;
transform:translate(-50%,-50%);
transition:0.2s ease;
box-shadow:0 0 12px var(--blue);
}

.cursor-grow{
transform:translate(-50%,-50%) scale(2.5);
background:var(--yellow);
}

.cursor-click{
transform:translate(-50%,-50%) scale(1.5);
background:white;
}

/* NAVBAR */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(255,255,255,0.4);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{
margin:0;
font-size:18px;
font-weight:700;
}

/* BUTTON */
button{
background:var(--dark);
color:white;
border:none;
padding:10px 22px;
border-radius:30px;
font-weight:600;
transition:0.25s ease;
}

button:hover{
background:var(--blue);
transform:translateY(-2px);
}

/* HERO */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.hero h1{
font-size:64px;
background:linear-gradient(90deg,var(--dark),var(--blue));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
max-width:650px;
margin:20px auto;
font-weight:700;
line-height:1.7;
}

/* INSTAGRAM BUTTON */
.insta-btn{
margin-top:15px;
background:#E1306C;
color:white;
border:none;
padding:12px 26px;
border-radius:30px;
font-weight:600;
cursor:none;
transition:0.3s ease;
}

.insta-btn:hover{
background:var(--blue);
transform:translateY(-3px) scale(1.05);
}

/* SECTIONS */
.section{
padding:100px 20px;
max-width:1100px;
margin:auto;
}

h2{
color:var(--blue);
font-size:32px;
margin-bottom:30px;
}

/* REELS */
.reels{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.reel{
border-radius:20px;
overflow:hidden;
background:white;
box-shadow:0 15px 40px rgba(0,0,0,0.1);
transition:0.3s ease;
}

.reel iframe{
width:100%;
height:400px;
border:none;
}

.reel:hover{
transform:translateY(-8px) scale(1.02);
}

/* SERVICES */
.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.service{
background:white;
padding:30px;
border-radius:20px;
font-weight:600;
transition:0.3s ease;
}

.service:hover{
background:var(--blue);
color:white;
transform:translateY(-8px) scale(1.03);
}

/* CONTACT */
.contact input,.contact textarea{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
}

.contact button{
width:100%;
padding:14px;
}

/* FADE ANIMATION */
.fade-up{
opacity:0;
transform:translateY(40px);
transition:0.9s ease;
}

.fade-up.show{
opacity:1;
transform:translateY(0);
}

/* FOOTER */
footer{
padding:30px;
font-weight:600;
opacity:0.8;
}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<!-- NAVBAR -->
<nav>
<h3 class="logo">Sadafmade.it</h3>
<button onclick="openInsta()">Instagram</button>
</nav>

<!-- HERO -->
<section class="hero fade-up">
<div>

<h1>Stories in Motion</h1>

<p>
I create cinematic reels that capture attention in seconds.
Emotion. Depth. Storytelling.
</p>

<!-- INSTAGRAM BUTTON ADDED HERE -->
<button class="insta-btn" onclick="openInsta()">View Insta Page</button>

</div>
</section>

<!-- WORK -->
<section class="section fade-up">
<h2>Featured Work</h2>

<div class="reels">
<div class="reel"><iframe src="https://www.instagram.com/reel/DPMDQ9ejRjd/embed"></iframe></div>
<div class="reel"><iframe src="https://www.instagram.com/reel/DP-vWzHExxb/embed"></iframe></div>
<div class="reel"><iframe src="https://www.instagram.com/reel/DSkNxg8E1fC/embed"></iframe></div>
<div class="reel"><iframe src="https://www.instagram.com/reel/DTIyKZLjUHR/embed"></iframe></div>
</div>
</section>

<!-- WORKFLOW -->
<section class="section fade-up">
<h2>Workflow</h2>
<div class="services">
<div class="service">Concept</div>
<div class="service">Shoot</div>
<div class="service">Edit</div>
<div class="service">Deliver</div>
</div>
</section>

<!-- WHY CHOOSE ME -->
<section class="section fade-up">
<h2>Why Choose Me</h2>
<div class="services">
<div class="service">Cinematic Quality</div>
<div class="service">Fast Delivery</div>
<div class="service">Creative Direction</div>
<div class="service">Attention to Detail</div>
</div>
</section>

<!-- CONTACT -->
<section class="section contact fade-up">
<h2>Contact</h2>
<input placeholder="Name">
<input placeholder="Email">
<textarea placeholder="Project"></textarea>
<button onclick="openInsta()">Send via Instagram</button>
</section>

<footer>© 2026 Sadafmade.it</footer>

<script>

/* INSTAGRAM LINK */
function openInsta(){
window.open("https://www.instagram.com/sadafmade.it?igsh=MXUxa3NzNnByaXlwcQ%3D%3D&utm_source=qr","_blank");
}

/* CURSOR */
const cursor=document.getElementById("cursor");

let mx=0,my=0,cx=0,cy=0;

document.addEventListener("mousemove",(e)=>{
mx=e.clientX;
my=e.clientY;
});

function animate(){
cx+=(mx-cx)*0.15;
cy+=(my-cy)*0.15;
cursor.style.left=cx+"px";
cursor.style.top=cy+"px";
requestAnimationFrame(animate);
}
animate();

document.querySelectorAll("button,.reel,.service").forEach(el=>{
el.addEventListener("mouseenter",()=>cursor.classList.add("cursor-grow"));
el.addEventListener("mouseleave",()=>cursor.classList.remove("cursor-grow"));
});

document.addEventListener("mousedown",()=>cursor.classList.add("cursor-click"));
document.addEventListener("mouseup",()=>cursor.classList.remove("cursor-click"));

/* FADE ANIMATION */
const elements=document.querySelectorAll('.fade-up');

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('show');
}
});
},{threshold:0.15});

elements.forEach(el=>observer.observe(el));

</script>

</body>
</html>
