<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadafmade.it — Cinematic Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--yellow:#FFB703;
--yellow-soft:#FFE082;
--dark:#121212;

/* 🌊 BLUE */
--blue:#0ea5e9;
}

html{scroll-behavior:smooth;}

body{
margin:0;
font-family:'Poppins', sans-serif;
background:linear-gradient(180deg, rgba(255,183,3,0.85), rgba(255,224,130,0.85));
color:var(--dark);
overflow-x:hidden;
cursor:none;
text-align:center;
}

/* ===== SINGLE WAVE ===== */
.wave-bg{
position:fixed;
bottom:0;
left:0;
width:100%;
height:100vh;
z-index:-1;
overflow:hidden;
pointer-events:none;
}

.wave{
position:absolute;
bottom:0;
width:100%;
height:260px;
overflow:hidden;
}

.wave-track{
display:flex;
width:200%;
animation:waveMove 6s linear infinite;
}

.wave svg{
width:50%;
height:100%;
display:block;
}

.wave path{
fill:var(--blue);
fill-opacity:0.45; /* adjust here */
}

@keyframes waveMove{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* CURSOR */
.cursor{
width:14px;
height:14px;
border-radius:50%;
background:var(--blue);
position:fixed;
pointer-events:none;
z-index:2000;
transform:translate(-50%,-50%);
transition:transform 0.08s ease;
box-shadow:0 0 12px var(--blue);
}

.cursor-grow{transform:translate(-50%,-50%) scale(2.5);background:var(--yellow);}
.cursor-click{transform:translate(-50%,-50%) scale(1.5);background:white;}

/* NAV */
nav{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:rgba(255,255,255,0.4);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{font-weight:700;}

button{
background:var(--dark);
color:white;
border:none;
padding:10px 22px;
border-radius:30px;
font-weight:600;
transition:0.25s ease;
}

button:hover{
background:var(--blue);
transform:translateY(-2px);
}

/* HERO */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.hero h1{
font-size:64px;
background:linear-gradient(90deg,var(--dark),var(--blue));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
max-width:650px;
margin:20px auto;
font-weight:700;
}

.insta-btn{
margin-top:15px;
background:#E1306C;
padding:12px 26px;
border-radius:30px;
}

.insta-btn:hover{
background:var(--blue);
transform:translateY(-3px);
}

/* SECTIONS */
.section{
padding:100px 20px;
max-width:1100px;
margin:auto;
}

h2{color:var(--blue);}

.reels{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.reel{
border-radius:20px;
overflow:hidden;
background:white;
box-shadow:0 15px 40px rgba(0,0,0,0.1);
}

.reel iframe{
width:100%;
height:400px;
border:none;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.service{
background:white;
padding:30px;
border-radius:20px;
font-weight:600;
}

/* FOOTER */
footer{
padding:30px;
font-weight:600;
}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<!-- 🌊 SINGLE CONTINUOUS WAVE -->
<div class="wave-bg">
  <div class="wave">
    <div class="wave-track">
      <svg viewBox="0 0 1440 320">
        <path d="M0,160L60,165C120,171,240,181,360,176C480,171,600,149,720,144C840,139,960,149,1080,160C1200,171,1320,181,1440,192L1440,320L0,320Z"></path>
      </svg>
      <svg viewBox="0 0 1440 320">
        <path d="M0,160L60,165C120,171,240,181,360,176C480,171,600,149,720,144C840,139,960,149,1080,160C1200,171,1320,181,1440,192L1440,320L0,320Z"></path>
      </svg>
    </div>
  </div>
</div>

<nav>
<h3 class="logo">Sadafmade.it</h3>
<button onclick="openInsta()">Instagram</button>
</nav>

<section class="hero">
<div>
<h1>Stories in Motion</h1>
<p>Cinematic reels crafted with emotion, depth, and storytelling.</p>
<button class="insta-btn" onclick="openInsta()">View Insta Page</button>
</div>
</section>

<footer>© 2026 Sadafmade.it</footer>

<script>
const cursor=document.getElementById("cursor");

let mouseX=0,mouseY=0;
let currentX=0,currentY=0;

document.addEventListener("mousemove",(e)=>{
mouseX=e.clientX;
mouseY=e.clientY;
});

function animate(){
currentX+=(mouseX-currentX)*0.25;
currentY+=(mouseY-currentY)*0.25;
cursor.style.left=currentX+"px";
cursor.style.top=currentY+"px";
requestAnimationFrame(animate);
}
animate();

function openInsta(){
window.open("https://www.instagram.com/sadafmade.it","_blank");
}
</script>

</body>
</html>
